<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookit — Step 1: Service</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0eeeb;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 2rem 1rem 6rem;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --accent: #1a7a6e;
    --accent-light: #e8f5f3;
    --accent-border: #1a7a6e;
    --text-primary: #1c1c1a;
    --text-secondary: #6b6b68;
    --text-muted: #a8a8a5;
    --border: #e0deda;
    --border-hover: #c8c8c4;
    --bg-card: #ffffff;
    --bg-page: #f0eeeb;
    --radius-card: 14px;
    --radius-btn: 12px;
  }

  .wizard-shell {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── Progress bar ── */
  .progress-bar {
    background: #ffffff;
    border-radius: 16px 16px 0 0;
    padding: 1.25rem 1.5rem 0;
    border-bottom: 1px solid var(--border);
  }

  .steps-row {
    display: flex;
    align-items: flex-start;
    gap: 0;
    position: relative;
  }

  .step-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    padding-bottom: 14px;
  }

  .step-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.01em;
    text-align: center;
    line-height: 1.3;
  }

  .step-item.active .step-label {
    color: var(--accent);
    font-weight: 600;
  }

  .step-item.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2.5px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
  }

  .bar-track {
    height: 2.5px;
    background: var(--border);
    border-radius: 0 0 0 0;
    position: relative;
    overflow: hidden;
  }

  /* ── Main content area ── */
  .wizard-body {
    background: #ffffff;
    padding: 1.75rem 1.5rem;
    border-radius: 0 0 16px 16px;
  }

  .step-heading {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin-bottom: 4px;
  }

  .step-subheading {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }

  /* ── Category group ── */
  .category-group {
    margin-bottom: 1.5rem;
  }

  .category-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  /* ── Service grid ── */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }

  /* 1 column when only 1–2 services */
  .services-grid.few {
    grid-template-columns: 1fr;
  }

  .service-card {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-card);
    padding: 1rem 1.125rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    user-select: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .service-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  .service-card.selected {
    border-color: var(--accent-border);
    background: var(--accent-light);
  }

  .service-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .service-card.selected .service-name {
    color: var(--accent);
  }

  .service-duration {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ── Footer ── */
  .wizard-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 100;
  }

  .footer-inner {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-continue {
    width: 100%;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: var(--radius-btn);
    padding: 15px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .btn-continue:hover {
    background: #155f55;
  }

  .btn-continue:active {
    transform: scale(0.99);
  }

  .btn-continue:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
    transform: none;
  }

  .btn-back {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    cursor: not-allowed;
    padding: 2px;
    text-align: center;
    font-family: inherit;
  }

  /* ── Responsive: single column on narrow screens ── */
  @media (max-width: 500px) {
    body { padding: 1rem 0.75rem 7rem; }
    .progress-bar { padding: 1rem 1rem 0; }
    .wizard-body { padding: 1.5rem 1rem; }
    .step-label { font-size: 10px; }
    .services-grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    }
    .wizard-footer { padding: 0.875rem 1rem; }
  }
</style>
</head>
<body>

<div class="wizard-shell">

  <!-- Progress bar -->
  <div class="progress-bar">
    <div class="steps-row">
      <div class="step-item active">
        <span class="step-label">Service</span>
      </div>
      <div class="step-item">
        <span class="step-label">Staff</span>
      </div>
      <div class="step-item">
        <span class="step-label">Date &amp; Time</span>
      </div>
      <div class="step-item">
        <span class="step-label">Your Details</span>
      </div>
      <div class="step-item">
        <span class="step-label">Payment</span>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="wizard-body">

    <h1 class="step-heading">What would you like to book?</h1>
    <p class="step-subheading">Select a service to get started.</p>

    <!-- Category: Massage -->
    <div class="category-group">
      <p class="category-label">Massage</p>
      <div class="services-grid" id="grid-massage">
        <div class="service-card selected" onclick="selectCard(this, 'grid-massage')">
          <span class="service-name">Swedish Massage</span>
          <span class="service-duration">60 min</span>
        </div>
        <div class="service-card" onclick="selectCard(this, 'grid-massage')">
          <span class="service-name">Deep Tissue Massage</span>
          <span class="service-duration">60 min</span>
        </div>
        <div class="service-card" onclick="selectCard(this, 'grid-massage')">
          <span class="service-name">Hot Stone Therapy</span>
          <span class="service-duration">75 min</span>
        </div>
        <div class="service-card" onclick="selectCard(this, 'grid-massage')">
          <span class="service-name">Aromatherapy</span>
          <span class="service-duration">45 min</span>
        </div>
      </div>
    </div>

    <!-- Category: Facials -->
    <div class="category-group">
      <p class="category-label">Facials</p>
      <div class="services-grid" id="grid-facials">
        <div class="service-card" onclick="selectCard(this, 'grid-facials')">
          <span class="service-name">Classic Facial</span>
          <span class="service-duration">45 min</span>
        </div>
        <div class="service-card" onclick="selectCard(this, 'grid-facials')">
          <span class="service-name">Luxury Facial</span>
          <span class="service-duration">75 min</span>
        </div>
      </div>
    </div>

    <!-- Category: Body — single service example (1 col) -->
    <div class="category-group">
      <p class="category-label">Body</p>
      <div class="services-grid few" id="grid-body">
        <div class="service-card" onclick="selectCard(this, 'grid-body')">
          <span class="service-name">Full Body Scrub</span>
          <span class="service-duration">60 min</span>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Sticky footer -->
<div class="wizard-footer">
  <div class="footer-inner">
    <button class="btn-continue" id="btn-continue">Continue</button>
    <button class="btn-back" disabled>Back</button>
  </div>
</div>

<script>
  function selectCard(card, gridId) {
    document.querySelectorAll('#' + gridId + ' .service-card').forEach(function(c) {
      c.classList.remove('selected');
    });
    card.classList.add('selected');
    document.getElementById('btn-continue').disabled = false;
  }

  document.getElementById('btn-continue').disabled = false;
</script>

</body>
</html>
